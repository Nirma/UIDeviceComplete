name: Swift CI
run-name: Build smoke test by ${{ github.actor }}

on: [push, pull_request]

jobs:
  test:
    name: Test UIDeviceComplete
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: Test (iOS)
      run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "UIDeviceComplete.xcodeproj" -scheme "UIDeviceComplete" -destination "OS=latest,name=iPhone 17 Pro Max" clean test | xcpretty
    - name: Test (watchOS)
      run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "UIDeviceComplete.xcodeproj" -scheme "UIDeviceComplete" -destination "OS=latest,name=Apple Watch Series 11 (46mm)" clean test | xcpretty
